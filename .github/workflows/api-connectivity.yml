name: فحص اتصال NVIDIA من الموقع العام

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public API health
        run: |
          set -euo pipefail
          curl -fSL --max-time 15 --retry 2 https://raw-selfie-nvidia-api.vercel.app/api/health | grep -F '"status":"ok"'
      - name: Verify browser CORS preflight from GitHub Pages
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -D /tmp/cors-headers --max-time 15 -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://emadaden77.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            https://raw-selfie-nvidia-api-emadaden77s-projects.vercel.app/api/prompt)
          echo "CORS preflight status: $status"
          cat /tmp/cors-headers
          test "$status" = "204"
          python3 - <<'PY'
          from pathlib import Path
          headers = Path('/tmp/cors-headers').read_text().lower().splitlines()
          assert 'access-control-allow-origin: https://emadaden77.github.io' in headers
          assert any(line.startswith('access-control-allow-methods:') and 'post' in line for line in headers)
          PY
      - name: Reject browser-supplied NVIDIA API keys
        run: |
          node --input-type=module <<'JS'
          const ids = {locations:'location-1',clothing:'clothing-1',
            expressions:'expression-1',hairstyles:'hair-1',selfieAngles:'angle-1',
            poses:'pose-1',carConditions:'clean-1',lighting:'light-1'};
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 37000);
          try {
            const response = await fetch('https://raw-selfie-nvidia-api-emadaden77s-projects.vercel.app/api/prompt', {
              method:'POST',
              headers:{'Content-Type':'application/json','Origin':'https://emadaden77.github.io'},
              body:JSON.stringify({selections:ids,variation:1,nvidiaApiKey:'nvapi-'+'not-a-real-key-000000000000'}),
              signal:controller.signal,
            });
            const body = await response.json();
            console.log(JSON.stringify({status:response.status,source:body.source,reason:body.reason}));
            if (response.status !== 400) process.exitCode=1;
          } catch (e) { console.error('Server-only NVIDIA credential security probe failed:',e.name); process.exitCode=1; }
          finally { clearTimeout(timer); }
          JS
