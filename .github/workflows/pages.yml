name: نشر واجهة التطبيق على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore missing Linux Rollup optional binary if needed
        run: |
          if ! node -e "require('@rollup/rollup-linux-x64-gnu')"; then
            version="$(node -p "require('rollup/package.json').version")"
            npm install --no-save --no-package-lock --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$version"
          fi
      - name: Build static website
        env:
          GITHUB_PAGES: 'true'
          VITE_API_BASE_URL: https://raw-selfie-nvidia-api-emadaden77s-projects.vercel.app
        run: npm run build:frontend
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
