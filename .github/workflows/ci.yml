name: فحص المشروع

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Frontend and backend TypeScript checks
        run: npm run typecheck
      - name: Build frontend and backend
        run: npm run build
      - name: Backend tests
        run: npm test
