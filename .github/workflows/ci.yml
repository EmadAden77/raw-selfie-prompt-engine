name: فحص المشروع

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore missing Linux Rollup optional binary if needed
        run: |
          if ! node -e "require('@rollup/rollup-linux-x64-gnu')"; then
            version="$(node -p "require('rollup/package.json').version")"
            npm install --no-save --no-package-lock --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$version"
          fi
      - name: Frontend and backend TypeScript checks
        run: npm run typecheck
      - name: Build frontend and backend
        run: npm run build
      - name: Backend tests
        run: npm test
      - name: Codespaces private-port routing smoke test
        run: node .devcontainer/smoke.mjs
